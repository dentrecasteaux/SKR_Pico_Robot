; PlatformIO Project Configuration File
;
; Core: Earle Philhower arduino-pico (via the maxgerhardt platform), not the
; Arduino mbed core. arduino-pico provides setup1()/loop1() for the second
; RP2040 core, which the IMU work uses, and the full pico-sdk used by the PIO
; STEP generator.
;
; https://docs.platformio.org/page/projectconf.html
; https://arduino-pico.readthedocs.io/en/latest/platformio.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
; Keep the USB identity the mbed build used, so the Pi still finds the board as
; /dev/serial/by-id/usb-Arduino_RaspberryPi_Pico_*-if00.
board_build.arduino.earlephilhower.usb_manufacturer = Arduino
board_build.arduino.earlephilhower.usb_product = RaspberryPi Pico
monitor_speed = 115200
build_flags =
    ; arduino-pico's PlatformIO build omits float printf support.
    -Wl,-u,_printf_float
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
